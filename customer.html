<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOANSMEET Customer Portal</title><meta name="description" content="Secure LOANSMEET application tracking portal"><style>body{font-family:Inter,Arial,sans-serif;background:#090b10;color:#f5f5f5;margin:0}.wrap{max-width:900px;margin:40px auto;padding:24px}.card{background:#121722;border:1px solid #273044;border-radius:18px;padding:22px;margin:16px 0}input,button{padding:12px;border-radius:10px;border:1px solid #39445b;background:#0c111b;color:#fff;margin:5px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#9aa5ba}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1d2638}.error{color:#ff9b9b}</style></head><body><div class="wrap"><h1>LOANSMEET Customer Portal</h1><p class="muted">Track your application, timeline and document status.</p><div id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="err" class="error"></div><hr><h3>Create account</h3><input id="code" placeholder="Application ID (LM-...)"/><input id="token" placeholder="Tracking token"/><input id="newpass" type="password" placeholder="New password (10+ chars)"><button onclick="register()">Create account</button></div><div id="dash" style="display:none"><div class="card" id="summary"></div><div class="card"><h2>Application timeline</h2><div id="timeline"></div></div><div class="card"><h2>Documents</h2><div id="docs"></div></div><button onclick="logout()">Sign out</button></div></div><script>let token=localStorage.getItem('lm_customer');const $=id=>document.getElementById(id);async function api(url,o={}){const r=await fetch(url,{...o,headers:{'Content-Type':'application/json',Authorization:token?'Bearer '+token:''}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function login(){try{const j=await api('/api/customer/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=j.token;localStorage.setItem('lm_customer',token);load()}catch(e){$('err').textContent=e.message}}async function register(){try{await api('/api/customer/account/register',{method:'POST',body:JSON.stringify({applicationCode:$('code').value,trackingToken:$('token').value,password:$('newpass').value})});$('err').textContent='Account created. Please sign in.'}catch(e){$('err').textContent=e.message}}async function load(){try{const j=await api('/api/customer/me');$('login').style.display='none';$('dash').style.display='block';$('summary').innerHTML='<h2>'+j.application.code+'</h2><div class="grid"><div>Status<br><b class="pill">'+j.application.status+'</b></div><div>Loan<br><b>'+j.lead.loan_type+'</b></div><div>Amount<br><b>₹'+Number(j.lead.loan_amount).toLocaleString('en-IN')+'</b></div><div>Priority<br><b>'+j.application.priority+'</b></div></div>';$('timeline').innerHTML=j.application.timeline.map(x=>'<p><b>'+x.status+'</b> · '+x.created_at+'<br><span class="muted">'+(x.note||'')+'</span></p>').join('')||'No updates yet.';$('docs').innerHTML=j.application.documents.map(x=>'<p><b>'+x.document_type+'</b> · '+x.file_name+' · <span class="pill">'+x.verification_status+'</span></p>').join('')||'No documents uploaded yet.'}catch(e){localStorage.removeItem('lm_customer');token='';$('err').textContent=e.message}}async function logout(){await api('/api/customer/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('lm_customer');location.reload()}if(token)load();</script></body></html>
