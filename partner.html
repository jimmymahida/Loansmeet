<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOANSMEET Partner Portal</title><style>body{font-family:Inter,Arial,sans-serif;background:#090b10;color:#f5f5f5;margin:0}.wrap{max-width:1000px;margin:40px auto;padding:24px}.card{background:#121722;border:1px solid #273044;border-radius:18px;padding:22px;margin:16px 0}input,button{padding:12px;border-radius:10px;border:1px solid #39445b;background:#0c111b;color:#fff;margin:5px}button{cursor:pointer}.muted{color:#9aa5ba}.lead{border-top:1px solid #273044;padding:14px 0}.error{color:#ff9b9b}</style></head><body><div class="wrap"><h1>LOANSMEET Partner Portal</h1><p class="muted">Secure DSA/partner lead management.</p><div id="login" class="card"><h2>Partner sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="err" class="error"></div><hr><h3>Partner registration</h3><input id="company" placeholder="Company"><input id="contact" placeholder="Contact person"><input id="mobile" placeholder="Mobile"><input id="regemail" type="email" placeholder="Email"><input id="regpass" type="password" placeholder="Password (10+ chars)"><button onclick="register()">Register</button></div><div id="dash" style="display:none"><div class="card" id="profile"></div><div class="card"><h2>Assigned leads</h2><div id="leads"></div></div><button onclick="logout()">Sign out</button></div></div><script>let token=localStorage.getItem('lm_partner');const $=id=>document.getElementById(id);async function api(url,o={}){const r=await fetch(url,{...o,headers:{'Content-Type':'application/json',Authorization:token?'Bearer '+token:''}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function login(){try{const j=await api('/api/partner/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=j.token;localStorage.setItem('lm_partner',token);load()}catch(e){$('err').textContent=e.message}}async function register(){try{const j=await api('/api/partner/register',{method:'POST',body:JSON.stringify({company:$('company').value,contactPerson:$('contact').value,mobile:$('mobile').value,email:$('regemail').value,password:$('regpass').value})});$('err').textContent='Registered. Referral code: '+j.referralCode+'. Admin activation is required.'}catch(e){$('err').textContent=e.message}}async function load(){try{const [p,l]=await Promise.all([api('/api/partner/me'),api('/api/partner/leads')]);$('login').style.display='none';$('dash').style.display='block';$('profile').innerHTML='<h2>'+p.partner.company+'</h2><p>'+p.partner.contact_person+' · '+p.partner.email+'</p><p>Status: <b>'+ (p.partner.active?'Active':'Pending')+'</b></p>';$('leads').innerHTML=l.map(x=>'<div class="lead"><b>'+x.application_code+'</b> · '+x.name+' · '+x.loan_type+' · ₹'+Number(x.loan_amount).toLocaleString('en-IN')+'<br>Status: '+x.status+' <button onclick="updateLead('+x.id+',\'Accepted\')">Accept</button> <button onclick="updateLead('+x.id+',\'Rejected\')">Reject</button></div>').join('')||'No assigned leads.'}catch(e){localStorage.removeItem('lm_partner');token='';$('err').textContent=e.message}}async function updateLead(id,status){await api('/api/partner/leads/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function logout(){await api('/api/partner/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('lm_partner');location.reload()}if(token)load();</script></body></html>
