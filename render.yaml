services:
  - type: web
    name: loansmeet
    runtime: node
    plan: starter
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_2FA_CODE
        sync: false
      - key: SITE_URL
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: /var/data/loansmeet/uploads
      - key: BACKUP_DIR
        value: /var/data/loansmeet/backups
      - key: SENDGRID_API_KEY
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
    disk:
      name: loansmeet-data
      mountPath: /var/data/loansmeet
      sizeGB: 10
