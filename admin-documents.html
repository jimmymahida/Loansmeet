<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOANSMEET — Document verification</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="wrap" style="display:flex;justify-content:space-between;width:100%;align-items:center"><a class="brand" href="/admin"><img src="/logo.svg"></a><a class="btn" href="/admin">← Admin CRM</a></div></header><main class="wrap section"><div class="section-head"><div><div class="kicker">Admin · Documents</div><h1 style="font-size:60px">Verification centre.</h1></div><p class="muted">Review document status and mark requested files Verified or Rejected. Access remains protected by the admin session.</p></div><div class="panel table-wrap"><table class="compare"><thead><tr><th>Application</th><th>Customer</th><th>Type</th><th>File</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table></div></main><script>async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const r=await api('/api/admin/documents');document.querySelector('#rows').innerHTML=r.map(x=>`<tr><td><b>${esc(x.application_code||'—')}</b></td><td>${esc(x.name)}<br><span class="muted">${esc(x.mobile)}</span></td><td>${esc(x.document_type)}</td><td>${esc(x.file_name)}</td><td><span class="pill">${esc(x.verification_status)}</span></td><td><button class="btn" onclick="verify(${x.id},'Verified')">Verify</button> <button class="btn" onclick="verify(${x.id},'Rejected')">Reject</button></td></tr>`).join('')||'<tr><td colspan="6">No documents.</td></tr>'}catch(e){document.querySelector('#rows').innerHTML='<tr><td colspan="6" class="error">'+esc(e.message)+'</td></tr>'}}window.verify=async(id,status)=>{const reason=status==='Rejected'?prompt('Reason for rejection?')||'Rejected by admin':'';await api('/api/admin/documents/'+id+'/verify',{method:'POST',body:JSON.stringify({status,reason})});load()};load();</script></body></html>
