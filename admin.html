<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiora Admin</title><style>
:root{--bg:#050810;--p:#0c1320;--p2:#101a2b;--t:#f4f7fb;--m:#91a0b5;--l:#203047;--a:#4f8cff;--b:#7c5cff;--g:#2bd3a1;--r:#ff667a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#172d5c,#050810 40%);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:0 22px}.top{height:72px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand i{color:var(--a);font-style:normal}.muted{color:var(--m)}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;color:#fff;background:#17243a}button.primary{background:linear-gradient(90deg,var(--a),var(--b));font-weight:800}.login{max-width:420px;margin:100px auto}.card{background:#0c1320e8;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 20px 60px #0006}.field{margin-top:13px}.field label{display:block;color:#aebbd0;font-size:12px;margin-bottom:7px}input,select,textarea{width:100%;background:#070e19;border:1px solid var(--l);border-radius:10px;padding:12px;color:var(--t);outline:0}textarea{min-height:100px;resize:vertical}.btn{width:100%;margin-top:16px}.error{color:#ffcbd1;margin-top:12px;background:#ff667a12;border:1px solid #ff667a40;padding:11px;border-radius:9px;display:none}.dash{padding:28px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#0c1320e8;border:1px solid var(--l);border-radius:15px;padding:17px}.stat b{display:block;font-size:26px;margin-top:6px}.toolbar{margin:18px 0;display:grid;grid-template-columns:1.4fr 1fr 1fr auto auto;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #18263a;font-size:12px}.table th{color:#9fb0c7;background:#0a111d}.table tr:hover{background:#ffffff03}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#17243a;color:#cbd6e6}.actions{display:flex;gap:7px;align-items:center}.small{padding:7px 9px;font-size:11px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal .card{width:min(650px,100%);max-height:90vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.close{float:right}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar button{width:100%}}@media(max-width:550px){.stats{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
.brandline{display:flex;align-items:center;gap:10px}.badge{padding:6px 9px;border:1px solid var(--l);border-radius:99px;font-size:11px;color:#9eb5d7;background:#ffffff05}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;background:#5b8cff10}.table th{position:sticky;top:0;z-index:1}.pill{font-weight:700}.empty{padding:35px!important}.subhead{display:flex;align-items:end;justify-content:space-between;gap:20px}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#638fff;box-shadow:0 0 0 3px #5b8cff12}.toolbar button{white-space:nowrap}@media(max-width:700px){.subhead{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.top{height:auto;padding:14px 0}}
</style></head><body><header class="top"><div class="wrap" style="width:100%;display:flex;justify-content:space-between;align-items:center"><div class="brandline"><img class="brand-logo admin-logo" src="/logo.svg" alt="Fiora"><div class="brand-name">Fiora</div><span class="badge">Admin dashboard</span></div><div><a href="/" style="margin-right:12px;color:#9eb5d7;font-size:13px">View site</a><button id="logout">Logout</button></div></div></header><main class="wrap">
<section id="loginView" class="login card"><h1 style="margin-top:0">Admin login</h1><p class="muted">Manage customer enquiries and lead status.</p><form id="loginForm"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="primary btn" type="submit">Sign in</button><div id="loginError" class="error"></div></form></section>
<section id="dashView" class="dash" style="display:none"><div class="subhead"><div><h1 style="margin-bottom:5px">Lead dashboard</h1><div class="muted">Customer enquiries captured from the website.</div></div><div class="muted" style="font-size:12px">Live local database</div></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="Search name, mobile, city or email"><select id="status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Processing</option><option>Approved</option><option>Rejected</option><option>Closed</option></select><select id="loanType"><option value="">All loan types</option></select><button id="refresh" class="primary">Refresh</button><button id="export">Export CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Mobile</th><th>City</th><th>Loan</th><th>Amount</th><th>Income</th><th>CIBIL</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div class="modal" id="modal"><div class="card"><button class="close" id="close">Close</button><h2 id="modalTitle">Lead</h2><div id="detail"></div></div></div>
<script>
const $=s=>document.querySelector(s), loginView=$('#loginView'),dashView=$('#dashView'),loginError=$('#loginError');let current=[];
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function check(){try{await api('/api/admin/me');showDash()}catch{loginView.style.display='block';dashView.style.display='none'}}
function showDash(){loginView.style.display='none';dashView.style.display='block';loadTypes();loadAll()}
async function loadTypes(){try{const t=await api('/api/loan-types');const s=$('#loanType');s.innerHTML='<option value="">All loan types</option>';t.forEach(x=>s.add(new Option(x,x)))}catch{}}
async function loadAll(){try{const [stats,rows]=await Promise.all([api('/api/admin/stats'),api('/api/admin/leads?'+new URLSearchParams({search:$('#search').value,status:$('#status').value,loanType:$('#loanType').value}))]);current=rows;$('#stats').innerHTML=[['Total leads',stats.total],['Today',stats.today],['New',stats.newLeads],['Approved',stats.approved],['Loan amount',money(stats.amount)]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#rows').innerHTML=rows.map(r=>`<tr><td>#${r.id}</td><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.email||'—')}</span></td><td>${esc(r.mobile)}</td><td>${esc(r.city)}</td><td>${esc(r.loan_type)}</td><td>${money(r.loan_amount)}</td><td>${money(r.monthly_income)}</td><td>${esc(r.cibil_range||'—')}</td><td><span class="pill">${esc(r.status)}</span></td><td>${new Date(r.created_at.replace(' ','T')+'Z').toLocaleString()}</td><td><button class="small" onclick="openLead(${r.id})">View</button></td></tr>`).join('')||'<tr><td colspan="11" class="muted empty" style="text-align:center">No leads found for the current filters.</td></tr>'}catch(e){if(e.message.includes('authentication'))location.reload();else alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
window.openLead=async id=>{const r=await api('/api/admin/leads/'+id);$('#modalTitle').textContent=`Lead #${r.id} — ${r.name}`;$('#detail').innerHTML=`<div class="two"><div><div class="muted">Mobile</div><p>${esc(r.mobile)}</p></div><div><div class="muted">Email</div><p>${esc(r.email||'—')}</p></div><div><div class="muted">City</div><p>${esc(r.city)}</p></div><div><div class="muted">Loan</div><p>${esc(r.loan_type)} · ${money(r.loan_amount)}</p></div><div><div class="muted">Income</div><p>${money(r.monthly_income)}</p></div><div><div class="muted">Existing EMI</div><p>${money(r.existing_emi)}</p></div><div><div class="muted">Employment</div><p>${esc(r.employment_type)}</p></div><div><div class="muted">CIBIL</div><p>${esc(r.cibil_range||'—')}</p></div></div><div class="field"><label>Status</label><select id="editStatus">${['New','Contacted','Processing','Approved','Rejected','Closed'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="editNotes">${esc(r.notes||'')}</textarea></div><button class="primary" onclick="saveLead(${r.id})">Save changes</button>`;$('#modal').style.display='flex'};
window.saveLead=async id=>{try{await api('/api/admin/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('#editStatus').value,notes:$('#editNotes').value})});$('#modal').style.display='none';loadAll()}catch(e){alert(e.message)}};
$('#close').onclick=()=>$('#modal').style.display='none';$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').style.display='none'};$('#loginForm').onsubmit=async e=>{e.preventDefault();loginError.style.display='none';const d=Object.fromEntries(new FormData(e.currentTarget));try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});showDash()}catch(x){loginError.textContent=x.message;loginError.style.display='block'}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};$('#refresh').onclick=loadAll;$('#status').onchange=loadAll;$('#loanType').onchange=loadAll;let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadAll,300)};$('#export').onclick=()=>{window.location='/api/admin/export.csv'};check();
</script></body></html>
